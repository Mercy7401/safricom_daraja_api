{% extends "payments/base.html" %}
{% block content %}
<div class="card card-body shadow-sm text-center">
  <p>KES {{ payment.amount }} to {{ payment.phone }}</p>
  <h4 id="st">{{ payment.status }}</h4>
  <p id="rc">{{ payment.mpesa_receipt }}</p>
  <p class="text-muted small">Check your phone and enter your M-Pesa PIN.</p>
  <a href="{% url 'home' %}">Back</a>
</div>
<script>
  const timer = setInterval(async () => {
    const r = await fetch("{% url 'status_json' payment.pk %}");
    const d = await r.json();
    document.getElementById("st").textContent = d.status;
    document.getElementById("rc").textContent = d.receipt;
    if (d.status !== "PENDING") clearInterval(timer);
  }, 3000);
</script>
{% endblock %}
